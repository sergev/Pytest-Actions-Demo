name: Python package

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8 pytest

      - name: Lint with flake8
        run: |
          flake8 . --exclude=venv,.venv --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude=venv,.venv --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          coverage run -m pytest -v
          coverage report --include=demo.py --fail-under=100